name: update data and results
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "requirements.txt", ".github/workflows/**"]
  schedule:
    - cron: "23 6 5 * *"   # monthly; DfT updates BUS09 yearly
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python src/fetch_data.py
      - run: python src/analyse.py
      - name: Commit refreshed data and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results
          git diff --cached --quiet || git commit -m "Update data and results"
          git push
